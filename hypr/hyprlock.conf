general {
    hide_cursor = true
}
source = ~/.local/state/qs-wallpaper.conf

background {
    monitor =
    path = $wallpaper
    blur_passes = 0
    blur_size = 4
    brightness = 0.7
    contrast = 0.9
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 200
    halign = center
    valign = center
}
